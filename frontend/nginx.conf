server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1000M;

    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://server:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://server:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires 0;
    }

    location = /assets/version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires 0;
    }

    # JS + CSS bundles are content-hashed by the Angular esbuild builder
    # (main-ODNAZ6YI.js, chunk-XYZ.js) and a rebuild changes the file
    # body. The OLD `expires 5m` + `Cache-Control: public, must-revalidate`
    # let browsers serve stale bundles for up to 5 minutes after a docker
    # rebuild, which manifested as `TypeError: Cannot read properties of
    # undefined (reading 'length')` from `get summaryText` in the OLD
    # chunk persisting in user tabs.
    #
    # `Cache-Control: no-cache, must-revalidate` forces the browser to
    # always revalidate via `If-Modified-Since`, and nginx returns the
    # updated file (the Euler hash on disk has changed so the body
    # differs). `expires off` disables the `Expires` header so the only
    # revalidation signal is `Cache-Control`. The ETag header nginx
    # emits by default is sufficient to short-circuit unchanged files
    # with a 304 — so the cost is one revalidation request per page
    # load, NOT a full re-download.
    location ~* \.(js|css)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
