<div class="similar-carousel" [class.is-fallback]="galleryImages().length === 0">
  @if (galleryImages().length > 1) {
    <div class="sc-strip" [style.transform]="stripOffset()">
      @for (img of galleryImages(); track $index) {
        <img [src]="img" [alt]="hotel().name" loading="lazy" (error)="onImgError($any($event.target))" />
      }
    </div>
    <!-- Controles compartidos (mismo diseño que el comparador): puntitos
         píldora + flechas prev/next. La propagación del clic la corta el
         propio componente. -->
    <app-carousel-controls
      [count]="galleryImages().length"
      [activeIndex]="currentImageIdx()"
      [subjectLabel]="hotel().name"
      (navigate)="goToImage($event)"
      (previous)="prevImage()"
      (next)="nextImage()"
    />
  } @else if (galleryImages().length === 1) {
    <img
      class="sc-single"
      [src]="galleryImages()[0]"
      [alt]="hotel().name"
      loading="lazy"
      (error)="onImgError($any($event.target))"
    />
  } @else {
    <span class="material-symbols-outlined">hotel</span>
  }
</div>
