<aside class="surface-card filter-sidebar">
  <div class="sidebar-head">
    <h2>Filtros</h2>
    <p>Encuentra hoteles con disponibilidad y tarifas en tiempo real.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="applyFilters()" class="filter-form">
    <label class="field">
      <span>Destino</span>
      <input formControlName="destination" placeholder="Madrid, Quito, 123...">
    </label>

    <div class="field-grid">
      <label class="field">
        <span>Check-in</span>
        <input formControlName="checkIn" type="date">
      </label>
      <label class="field">
        <span>Check-out</span>
        <input formControlName="checkOut" type="date">
      </label>
    </div>

    <div class="field-grid">
      <label class="field">
        <span>Adultos</span>
        <input formControlName="adults" inputmode="numeric" placeholder="1">
      </label>
      <label class="field">
        <span>Niños</span>
        <input formControlName="children" inputmode="numeric" placeholder="0">
      </label>
    </div>

    <label class="field">
      <span>Habitaciones</span>
      <input formControlName="rooms" inputmode="numeric" placeholder="1">
    </label>

    <fieldset class="field-section">
      <legend>Precio por noche</legend>
      <div class="field-grid">
        <label class="field">
          <span>Mínimo</span>
          <input formControlName="minPrice" inputmode="decimal" placeholder="0">
        </label>
        <label class="field">
          <span>Máximo</span>
          <input formControlName="maxPrice" inputmode="decimal" placeholder="300">
        </label>
      </div>
    </fieldset>

    <label class="field">
      <span>Estrellas mínimas</span>
      <input formControlName="minStars" inputmode="decimal" placeholder="3">
    </label>

    <label class="field">
      <span>Servicios (amenities)</span>
      <input formControlName="amenities" placeholder="wifi, piscina">
      <select formControlName="amenitiesMode" class="mode-select">
        <option value="or">Cualquier término</option>
        <option value="and">Todos los términos</option>
      </select>
    </label>

    <label class="field">
      <span>Ordenar por</span>
      <select formControlName="sortBy">
        <option value="price">Precio (menor primero)</option>
        <option value="rating">Puntuación</option>
        <option value="stars">Estrellas</option>
        <option value="name">Nombre</option>
      </select>
    </label>

    <div class="form-actions">
      <button class="primary-action" type="submit">
        <span class="material-symbols-outlined btn-icon">search</span>
        Buscar
      </button>
      <button class="secondary-action" type="button" (click)="resetFilters()">
        <span class="material-symbols-outlined btn-icon">filter_alt_off</span>
        Limpiar
      </button>
    </div>
  </form>
</aside>
