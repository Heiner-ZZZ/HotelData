<section class="surface-card category-panel">
  <div class="panel-head">
    <span class="material-symbols-outlined category-icon">{{ getCategoryIcon(category().category) }}</span>
    <h2>{{ category().category }}</h2>
  </div>
  <div class="item-grid">
    @for (item of category().items; track item.label) {
      <label class="amenity-item">
        <input
          type="checkbox"
          [checked]="selectedLabels().has(item.label.toLowerCase())"
          (change)="onToggle(item.label)"
        >
        <span>{{ item.label }}</span>
      </label>
    }
  </div>
</section>
