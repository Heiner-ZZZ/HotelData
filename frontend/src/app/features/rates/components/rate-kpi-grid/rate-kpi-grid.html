<section class="kpi-grid">
  <article class="kpi-card glass">
    <div class="kpi-icon-wrap" style="--card-accent: var(--accent)">
      <span class="material-symbols-outlined kpi-icon">business</span>
    </div>
    <div class="kpi-body">
      <p class="kpi-label">Hotel</p>
      <h3 class="kpi-value">{{ data().hotelLabel }}</h3>
    </div>
    <app-info-tooltip [text]="'Operacion comercial de tarifas' + (data().profileBadge ? '. ' + data().profileBadge : '')"></app-info-tooltip>
  </article>

  <article class="kpi-card glass">
    <div class="kpi-icon-wrap" style="--card-accent: var(--success)">
      <span class="material-symbols-outlined kpi-icon">attach_money</span>
    </div>
    <div class="kpi-body">
      <p class="kpi-label">Planes Tarifarios</p>
      <h3 class="kpi-value">{{ data().ratePlansCount }}</h3>
    </div>
    <app-info-tooltip text="Planes tarifarios configurados para esta propiedad"></app-info-tooltip>
  </article>

  <article class="kpi-card glass">
    <div class="kpi-icon-wrap" style="--card-accent: var(--warning)">
      <span class="material-symbols-outlined kpi-icon">calendar_month</span>
    </div>
    <div class="kpi-body">
      <p class="kpi-label">Calendario</p>
      <h3 class="kpi-value">{{ data().calendarCount }}</h3>
    </div>
    <app-info-tooltip text="Filas recientes de tarifa por fecha"></app-info-tooltip>
  </article>

  <article class="kpi-card glass promo-card">
    <div class="kpi-icon-wrap" style="--card-accent: var(--accent)">
      <span class="material-symbols-outlined kpi-icon">campaign</span>
    </div>
    <div class="kpi-body">
      <p class="kpi-label">Promociones · Cupones</p>
      <div class="kpi-split">
        <div class="kpi-split-item">
          <span class="kpi-split-value">{{ data().promotionsCount }}</span>
          <span class="kpi-split-meta">campañas</span>
        </div>
        <span class="kpi-split-dot"></span>
        <div class="kpi-split-item">
          <span class="kpi-split-value">{{ data().couponsCount }}</span>
          <span class="kpi-split-meta">cupones</span>
        </div>
      </div>
    </div>
    <app-info-tooltip [text]="data().promotionsCount + ' campanas, ' + data().couponsCount + ' cupones'"></app-info-tooltip>
  </article>
</section>
