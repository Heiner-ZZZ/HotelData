<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<header class="welcome-header">
  <div class="welcome-header__inner">
    <a class="welcome-header__brand brand-mark" routerLink="/welcome" aria-label="HotelData, ir al inicio">
      <span class="brand-text">HotelData</span><span class="brand-dot" aria-hidden="true">.</span>
    </a>

    <nav class="welcome-header__actions" aria-label="Acciones de cuenta">
      <label class="chip chip--lang" aria-label="Cambiar moneda">
        <span class="chip-flag" aria-hidden="true" [innerHTML]="currencyFlag(selectedCurrency())"></span>
        <select
          class="chip__select"
          [value]="selectedCurrency()"
          (change)="onCurrencyChange($any($event.target).value)"
        >
          @for (cur of currencies(); track cur.code) {
            <option [value]="cur.code">{{ cur.code }} — {{ cur.name }}</option>
          }
        </select>
      </label>

      <a class="header-link" routerLink="/onboarding/alojamiento">
        <span class="material-symbols-outlined" aria-hidden="true">domain_add</span>
        Registra tu alojamiento
      </a>

      <a class="btn btn--ghost" routerLink="/register">
        <span class="material-symbols-outlined" aria-hidden="true">person_add</span>
        Crear cuenta
      </a>
      <a class="btn btn--solid" routerLink="/login">
        <span class="material-symbols-outlined" aria-hidden="true">login</span>
        Iniciar sesión
      </a>
    </nav>
  </div>
</header>

<nav class="welcome-tabs" aria-label="Categorías de búsqueda">
  <div class="welcome-tabs__inner">
    <button
      type="button"
      class="welcome-tab is-active"
      aria-current="true"
    >
      <span class="material-symbols-outlined" aria-hidden="true">hotel</span>
      <span>Hoteles</span>
    </button>
  </div>
</nav>

<main id="main-content">
<section class="welcome-search" aria-label="Buscador de hoteles">
  <div class="welcome-search__inner">
    <form class="booking-bar" [formGroup]="searchForm" (ngSubmit)="navigateToSearch()" role="search" aria-label="Buscar hoteles">
      <div class="booking-bar__field">
        <span class="material-symbols-outlined booking-bar__icon" aria-hidden="true">location_on</span>
        <div class="booking-bar__body">
          <label class="booking-bar__label" for="welcome-dest">Destino</label>
          <input
            id="welcome-dest"
            type="text"
            formControlName="destination"
            placeholder="Ciudad, hotel o zona"
            class="booking-bar__input"
            autocomplete="off"
          />
        </div>
      </div>
      <div class="booking-bar__field booking-bar__field--dates">
        <span class="material-symbols-outlined booking-bar__icon" aria-hidden="true">calendar_month</span>
        <div class="booking-bar__body">
          <span class="booking-bar__label">Entrada — Salida</span>
          <div class="booking-bar__dates">
            <input type="date" formControlName="checkIn" [min]="today" class="booking-bar__date" (change)="onCheckInChange()" />
            <span class="booking-bar__dates-sep" aria-hidden="true">→</span>
            <input type="date" formControlName="checkOut" [min]="minCheckOut()" class="booking-bar__date" />
          </div>
        </div>
      </div>
      <div class="booking-bar__field booking-bar__field--guests">
        <span class="material-symbols-outlined booking-bar__icon" aria-hidden="true">group</span>
        <div class="booking-bar__body">
          <span class="booking-bar__label">Huéspedes</span>
          <div class="booking-bar__guests">
            <select formControlName="adults" class="booking-bar__select" aria-label="Adultos" title="Adultos">
              @for (n of guestRange; track n) {
                <option [value]="n">{{ n }} {{ n === 1 ? 'adulto' : 'adultos' }}</option>
              }
            </select>
            <select formControlName="children" class="booking-bar__select" aria-label="Niños" title="Niños">
              @for (n of childRange; track n) {
                <option [value]="n">{{ n }} {{ n === 1 ? 'niño' : 'niños' }}</option>
              }
            </select>
            <select formControlName="rooms" class="booking-bar__select" aria-label="Habitaciones" title="Habitaciones">
              @for (n of roomRange; track n) {
                <option [value]="n">{{ n }} {{ n === 1 ? 'hab.' : 'habs.' }}</option>
              }
            </select>
          </div>
        </div>
      </div>
      <button type="submit" class="booking-bar__cta">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        Buscar
      </button>
    </form>

  </div>
</section>
</main>

<footer class="welcome-footer">
  <div class="welcome-footer__inner">
    <div class="footer-brand">
      <span class="brand-text">HotelData</span><span class="brand-dot" aria-hidden="true">.</span>
    </div>
    <p class="footer-copy">© {{ year }} HotelData · Plataforma académica de gestión hotelera.</p>
  </div>
</footer>
