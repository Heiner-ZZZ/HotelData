<div class="map-section">
  <div class="map-header">
    <span class="material-symbols-outlined map-header-icon">map</span>
    <span>Ubicación de hoteles</span>
    <button class="map-fit-btn" (click)="fitMapToHotels()" title="Ajustar mapa">
      <span class="material-symbols-outlined">my_location</span>
    </button>
  </div>
  <div #mapContainer class="map-container"></div>
  <div class="map-legend">
    <span class="map-legend-item">
      <span class="material-symbols-outlined" style="font-size:1rem;color:#1463FF">hotel</span>
      Hoteles
    </span>
  </div>
</div>
