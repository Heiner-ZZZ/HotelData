<div class="reservation-detail-page">
  @if (successMessage()) {
    <div class="toast toast-success">
      <span class="material-symbols-outlined">check_circle</span>
      {{ successMessage() }}
    </div>
  }

  @switch (viewState()) {
    @case ('loading') {
      <app-loading-state label="Cargando detalle de la reserva..." />
    }
    @case ('error') {
      <app-error-state title="No fue posible cargar la reserva" description="Intenta nuevamente o vuelve al listado." />
    }
    @case ('empty') {
      <app-empty-state title="No encontramos esa reserva" description="La reserva solicitada no existe o ya no está disponible." />
    }
    @default {
      @if (data(); as vm) {
        <app-page-header
          eyebrow="Detalle de reserva"
          [title]="vm.bookingId"
          [description]="'Estado actual: ' + vm.status + '.'"
        />

        <app-rd-hero
          [vm]="vm"
          [todayStr]="todayStr()"
          [canConfirm]="canConfirm() || false"
          [canEdit]="canEdit()"
          [isStaff]="isStaff()"
          [editMode]="editMode()"
          [cancelPending]="cancelPending()"
          [confirmPending]="confirmPending()"
          [rejectPending]="rejectPending()"
          (confirm)="confirmReservation()"
          (reject)="rejectReservation()"
          (cancel)="cancelReservation()"
          (toggleEdit)="toggleEdit()"
          (openRoomModal)="openRoomModal()"
          (goToInStay)="goToInStay($event)"
        />

        <app-rd-info-panels [vm]="vm" />

        <app-rd-financial-panels [vm]="vm" />

        @if (editMode()) {
          <app-rd-edit-form
            [form]="editForm()"
            [editSaving]="editSaving()"
            [editError]="editError()"
            (cancelEdit)="toggleEdit()"
            (saveEdit)="saveEdit()"
            (fieldChange)="handleFieldChange($event)"
          />
        }

        @if (data(); as current) {
          <app-reservation-timeline
            [reservation]="current"
            [isStaff]="isStaff()"
            (successMessage)="onTimelineMessage($event)"
          />
        }

        <app-rd-invoice-panel
          [vm]="vm"
          (goToInvoice)="goToInvoice($event)"
        />

        <app-rd-products-section
          [canAddProducts]="canAddProducts() || false"
          [productsState]="productsState()"
          [lineItemsState]="lineItemsState()"
          [lineItems]="lineItems()"
          [lineItemsTotal]="lineItemsTotal()"
          [removeItemSaving]="removeItemSaving()"
          (openProductModal)="openProductModal()"
          (removeLineItem)="removeLineItem($event)"
        />

        <app-rd-assigned-rooms [vm]="vm" />

        <app-rd-history-panel [vm]="vm" />

        <app-rd-product-modal
          [show]="showProductModal()"
          [productsState]="productsState()"
          [productsGrouped]="productsGrouped()"
          [productCategories]="productCategories()"
          [selectedProductCategory]="selectedProductCategory()"
          [filteredProducts]="filteredProducts()"
          [selectedProduct]="selectedProduct()"
          [addProductId]="addProductId()"
          [addProductQty]="addProductQty()"
          [addProductSaving]="addProductSaving()"
          [productError]="productError()"
          (close)="closeProductModal()"
          (selectCategory)="selectedProductCategory.set($event); addProductId.set('')"
          (selectProduct)="selectProduct($event)"
          (qtyDecrease)="addProductQty.update(q => Math.max(1, q - 1))"
          (qtyIncrease)="addProductQty.update(q => q + 1)"
          (qtyChange)="addProductQty.set(Math.max(1, $event))"
          (addToBooking)="addProductToBooking()"
        />

        <app-rd-room-modal
          [show]="showRoomModal()"
          [bookingId]="vm.bookingId"
          [hotelLabel]="vm.hotelLabel"
          [assignmentState]="roomAssignmentState()"
          [availableRooms]="availableRooms()"
          [assignedRoomIds]="assignedRoomIds()"
          [selectedRoomIds]="selectedRoomIds()"
          [roomsRequired]="roomsRequired()"
          [saving]="roomAssignmentSaving()"
          [message]="roomAssignmentMessage()"
          (close)="closeRoomModal()"
          (toggleRoom)="toggleRoomSelection($event)"
          (save)="saveRoomAssignment()"
        />
      }
    }
  }
</div>
