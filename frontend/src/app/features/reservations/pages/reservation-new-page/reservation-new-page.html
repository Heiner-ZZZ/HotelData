<div class="booking-page">
  <div class="booking-header">
    <a routerLink=".." class="back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Volver a solicitudes
    </a>

    <div class="step-indicator">
      <div class="step-dot" [class.is-active]="step() === 'details'" [class.is-done]="step() === 'review'">
        <span class="step-number">
          @if (step() === 'review') { <span class="material-symbols-outlined">check</span> }
          @else { 1 }
        </span>
        <span class="step-label">Detalles</span>
      </div>
      <div class="step-line" [class.is-done]="step() === 'review'"></div>
      <div class="step-dot" [class.is-active]="step() === 'review'">
        <span class="step-number">2</span>
        <span class="step-label">Revisar</span>
      </div>
    </div>
  </div>

  @if (loading()) {
    <div class="loading-shade">
      <div class="loading-card surface-card">
        <span class="material-symbols-outlined loading-spin">sync</span>
        <p>Cargando opciones de reserva...</p>
      </div>
    </div>
  } @else {
    @if (step() === 'details') {
      <form [formGroup]="form" (ngSubmit)="goToReview()" class="booking-form" novalidate>
        <app-rn-planner-section
          [form]="form"
          [hotelOptions]="hotelOptions()"
          [selectedHotel]="selectedHotel()"
          [preselectedRoomTypeName]="preselectedRoomTypeName()"
          [today]="today"
          [checkInDate]="form.controls.checkInDate.value || ''"
          [checkOutDate]="form.controls.checkOutDate.value || ''"
          [adults]="form.controls.adults.value"
          [children]="form.controls.children.value"
          [rooms]="form.controls.rooms.value"
          [computedNights]="computedNights()"
          [availabilityInfo]="selectedHotel() ? getHotelAvailabilityInfo(selectedHotel()!.propId) : null"
          [ratePlans]="availableRatePlans()"
          [ratePlansLoading]="ratePlansLoading()"
          [selectedRatePlanId]="selectedRatePlanId()"
          (startDateChange)="onStartDateChange($event)"
          (endDateChange)="onEndDateChange($event)"
          (adjust)="handleAdjust($event)"
          (ratePlanSelect)="selectRatePlan($event)"
        />

        <app-rn-guest-section
          [form]="form"
          [isClient]="isClient()"
          [selectedHotel]="selectedHotel()"
          [amenityLoading]="amenityCatalogLoading()"
          [amenityCatalog]="amenityCatalog()"
          [amenityError]="amenityCatalogError()"
          [selectedAmenities]="selectedAmenities()"
          [couponValidating]="couponValidating()"
          [couponStatus]="couponStatus()"
          [specialRequestsOptions]="specialRequestOptions"
          (toggleRequest)="handleToggleRequest($event)"
          (toggleAmenity)="toggleAmenity($event)"
          (validateCoupon)="validateCoupon()"
        />

        <div class="form-footer">
          <button type="button" class="btn-secondary" routerLink="/reservations">
            <span class="material-symbols-outlined">close</span> Cancelar
          </button>
          <button type="submit" class="btn-primary" [disabled]="form.invalid">
            <span class="material-symbols-outlined">chevron_right</span> Revisar solicitud
          </button>
        </div>
      </form>
    }

    @if (step() === 'review') {
      <div class="review-container">
        <app-rn-review-section
          [selectedHotel]="selectedHotel()"
          [guestName]="form.controls.guestName.value"
          [guestEmail]="form.controls.guestEmail.value"
          [guestPhone]="form.controls.guestPhone.value"
          [checkInDate]="form.controls.checkInDate.value"
          [checkOutDate]="form.controls.checkOutDate.value"
          [checkInTime]="form.controls.checkInTime.value"
          [checkOutTime]="form.controls.checkOutTime.value"
          [adults]="form.controls.adults.value"
          [children]="form.controls.children.value"
          [rooms]="form.controls.rooms.value"
          [nights]="computedNights()"
          [comment]="form.controls.comment.value"
          [specialRequests]="form.controls.specialRequests.value"
          [selectedAmenities]="selectedAmenities()"
          [couponCode]="form.controls.couponCode.value"
          [couponStatus]="couponStatus()"
          [preview]="preview()"
          [previewing]="previewing()"
        />

        <div class="form-footer">
          <button type="button" class="btn-secondary" (click)="backToDetails()">
            <span class="material-symbols-outlined">arrow_back</span> Editar datos
          </button>
          <button type="button" class="btn-primary" (click)="submit()" [disabled]="submitting() || !(preview()?.available ?? true)">
            @if (submitting()) {
              <span class="material-symbols-outlined loading-spin">sync</span> Enviando...
            } @else {
              <span class="material-symbols-outlined">send</span> Confirmar y enviar
            }
          </button>
        </div>
      </div>
    }
  }
</div>
