<div class="rooms-page">
  <app-page-header
    title="Tipos de Habitación"
    description="Administra los tipos de habitación, capacidades y habitaciones físicas de cada propiedad."
  >
    <app-property-selector
      slot="actions"
      [selectedPropId]="selectedPropId()"
      [selectedLabel]="selectedLabel()"
      (propIdChange)="onPropSelected($event)"
    />
  </app-page-header>

  <!-- KPI Chart: Top 5 Hotels by Room Count — hidden in single-hotel mode -->
  @if (!propertyCtx.singleHotelMode()) {
    @if (selectedPropId() === 0) {
      <section class="surface-card kpi-chart-section">
        <app-kpi-chart
          title="Top 5 Hoteles con más habitaciones"
          [labels]="topHotels().map(h => h.label)"
          [datasets]="[
            { label: 'Tipos de habitación', data: topHotels().map(h => h.room_types) },
            { label: 'Habitaciones físicas', data: topHotels().map(h => h.physical_rooms) }
          ]"
          [showLegend]="true"
          [height]="220"
          type="line"
        />
      </section>
    }
  }

  @switch (viewState()) {
    @case ('loading') {
      <app-loading-state label="Cargando habitaciones..." />
    }
    @case ('error') {
      <app-error-state
        title="No fue posible cargar las habitaciones"
        description="Revisa la API o selecciona otra propiedad."
      />
    }
    @case ('empty') {
      <app-empty-state
        icon="search"
        title="Selecciona una propiedad"
        description="El módulo de habitaciones necesita un hotel activo para cargar sus tipos."
      />
    }
    @default {
      @if (roomsResource.value(); as vm) {
        <app-rp-kpi-grid [vm]="vm" />

        <app-rp-create-form
          [createForm]="createForm"
          [createMode]="createMode()"
          [existingRoomTypes]="existingRoomTypes()"
          [selectedExistingId]="selectedExistingRoomTypeId()"
          [imagePreviewUrl]="createImagePreviewUrl()"
          (setMode)="setCreateMode($event)"
          (selectExisting)="onExistingTypeSelected($event)"
          (createRoomType)="createRoomType()"
          (imageUrlChange)="onCreateImageUrlChange($event)"
          (fileSelected)="onCreateFileSelected($event)"
        />

        <app-rp-tables
          [vm]="vm"
          (editRoom)="startEdit($event)"
          (deleteRoom)="requestDelete($event.id, $event.name)"
        />
      }
    }
  }

  @if (showDeleteConfirm()) {
    <app-rp-delete-modal
      [targetName]="deleteTargetName()"
      [targetId]="deleteTargetId()"
      [errorMessage]="errorMessage()"
      [deleting]="deleting()"
      (cancel)="cancelDelete()"
      (confirm)="confirmDelete()"
    />
  }

  @if (showEditModal()) {
    <app-rp-edit-modal
      [editForm]="editForm"
      [roomTypeName]="editingRoomTypeName()"
      [roomTypeId]="editingRoomTypeId()"
      [saving]="savingEdit()"
      [panelOpen]="featurePanelOpen()"
      [catalog]="featureCatalog()"
      [filteredCatalog]="filteredFeatureCatalog()"
      [searchQuery]="featureSearchQuery()"
      [selectedCount]="selectedFeatureCount()"
      [isSelected]="isFeatureSelectedFn"
      [imagePreviewUrl]="editImagePreviewUrl()"
      [uploading]="editUploading()"
      [selectedFile]="editSelectedFile()"
      (cancel)="cancelEdit()"
      (save)="saveEdit()"
      (togglePanel)="featurePanelOpen.set(!featurePanelOpen())"
      (searchChange)="featureSearchQuery.set($event)"
      (toggleFeature)="toggleFeature($event)"
      (imageUrlChange)="onEditImageUrlChange($event)"
      (fileSelected)="onEditFileSelected($event)"
      (uploadFile)="uploadEditFile()"
    />
  }
</div>
