<div class="monitoring-page">
  <app-page-header
    eyebrow="Observabilidad"
    title="Monitoreo"
    description="Salud de servicios, estado del pipeline ETL y reportes de calidad."
  />

  <div class="actions-bar">
    @if (actionMessage()) {
      <section class="surface-card message success">{{ actionMessage() }}</section>
    }
    @if (actionError()) {
      <section class="surface-card message error">{{ actionError() }}</section>
    }
    <button type="button" class="refresh-btn" (click)="refresh()" [disabled]="viewState() === 'loading'">
      Actualizar
    </button>
  </div>

  @switch (viewState()) {
    @case ('loading') {
      <app-loading-state label="Cargando estado de monitoreo..." />
    }
    @case ('error') {
      <app-error-state
        title="No fue posible cargar el monitoreo"
        [description]="loadErrorMessage() || 'Revisa la conexión con la API o vuelve a intentar en unos segundos.'"
      />
    }
    @default {
      @if (viewModel(); as vm) {
        <!-- Service health box — OnPush aislado: su acordeón es estado local -->
        <app-mp-services-box [services]="vm.services" />

        <!-- CSV Upload box — OnPush aislado: solo se actualiza con su propio estado -->
        <app-mp-csv-upload-box
          [busy]="uploadBusy()"
          [selectedFileName]="selectedFile()?.name ?? null"
          (fileSelected)="onFileSelected($event)"
          (upload)="uploadCsv()"
        />

        <!-- ETL progress box — OnPush aislado: solo se re-renderiza con el progreso real del pipeline -->
        <app-mp-etl-progress-box
          [progress]="vm.progress"
          [targetPocketbase]="targetPocketbase()"
          [targetMongodb]="targetMongodb()"
          [incrementalMode]="incrementalMode()"
          [actionBusy]="actionBusy()"
          (stopSeed)="triggerStop('seed')"
          (stopPipeline)="triggerStop('pipeline')"
          (seed)="triggerSeed()"
          (validate)="triggerValidate()"
          (pipeline)="triggerRunPipeline()"
          (clearEvidence)="triggerClearEvidence()"
          (targetPocketbaseChange)="targetPocketbase.set($event)"
          (targetMongodbChange)="targetMongodb.set($event)"
          (incrementalModeChange)="incrementalMode.set(!incrementalMode())"
        />

        <!-- Reports box — OnPush aislado: su acordeón es estado local -->
        <app-mp-reports-box [reports]="vm.reports" />

        <!-- Execution box — OnPush aislado: su acordeón es estado local -->
        <app-mp-execution-box [execution]="vm.execution" />
      }
    }
  }
  <!-- Confirmación ETL: diálogo global (ConfirmDialogService, montado en app.html). -->
</div>
