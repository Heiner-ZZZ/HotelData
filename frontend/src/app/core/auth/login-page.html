<a class="back-home" routerLink="/welcome">
  <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
  Volver al inicio
</a>

<main class="login-page">
  <div class="login-hero">
    <a routerLink="/welcome" class="brand-mark" aria-label="HotelData, ir al inicio">
      <span class="brand-text">HotelData</span><span class="brand-dot" aria-hidden="true">.</span>
    </a>
  </div>

  <section class="login-card surface-card">
    <div class="card-head">
      <p class="eyebrow">
        <span class="material-symbols-outlined card-head-icon">lock</span>
        Acceso seguro
      </p>
      <h2>Iniciar sesión</h2>
    </div>

    @if (errorMessage()) {
      <div class="notice notice-error">{{ errorMessage() }}</div>
    }

    <form class="login-form" (submit)="$event.preventDefault(); submit()">
      <label class="input-field">
        <span class="material-symbols-outlined input-icon">person</span>
        <span class="input-label">Usuario o correo</span>
        <input
          type="text"
          id="identifier"
          name="identifier"
          [value]="identifier()"
          (input)="identifier.set($any($event.target).value)"
          placeholder="superadmin o admin@hoteldata.local"
          autocomplete="username"
        >
      </label>

      <label class="input-field">
        <span class="material-symbols-outlined input-icon">lock</span>
        <span class="input-label">Contraseña</span>
        <div class="password-field">
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            id="password"
            name="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="Tu contraseña"
            autocomplete="current-password"
          >
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePasswordVisibility()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" class="password-toggle-icon">
              @if (passwordVisible()) {
                <path
                  d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 5.1A10.9 10.9 0 0 1 12 5c5.5 0 9.5 4.1 10.8 7-0.5 1.1-1.4 2.4-2.6 3.6M6.7 6.8C4.6 8 3.2 10.1 2.2 12 3.5 14.9 7.5 19 13 19c1 0 2-.1 2.9-.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              } @else {
                <path
                  d="M2.2 12C3.5 9.1 7.5 5 13 5s9.5 4.1 10.8 7c-1.3 2.9-5.3 7-10.8 7S3.5 14.9 2.2 12Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              }
            </svg>
            @if (passwordVisible()) {
              <span class="sr-only">Ocultar</span>
            } @else {
              <span class="sr-only">Ver</span>
            }
          </button>
        </div>
      </label>

      <label class="checkbox-field remember-me">
        <input
          type="checkbox"
          id="rememberMe"
          name="rememberMe"
          [checked]="rememberMe()"
          (change)="rememberMe.set($any($event.target).checked)"
        >
        <span class="checkbox-label">Recordarme</span>
      </label>

      <div class="forgot-link">
        <a routerLink="/recover">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="material-symbols-outlined btn-icon">sync</span>
          Entrando...
        } @else {
          <span class="material-symbols-outlined btn-icon">login</span>
          Entrar
        }
      </button>
    </form>

    <p class="card-register">
      ¿No tienes cuenta?
      <a routerLink="/register">Crear cuenta</a>
    </p>
  </section>
</main>
