<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>HotelData Frontend</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/runtime-config.js"></script>
    <script>
      (function() {
        // /login y /welcome (landing público) siempre en modo claro — el
        // Angular app forceLight(/welcome) lo mantiene tras el arranque.
        if (window.location.pathname === '/login' || window.location.pathname === '/welcome') { return; }
        var theme = localStorage.getItem('hoteldata-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
  </html>
