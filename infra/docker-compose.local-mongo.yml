services:
  redis:
    image: redis:latest
    container_name: hoteldata_redis_localmongo
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: hoteldata_pocketbase_localmongo
    restart: unless-stopped
    profiles: ["pocketbase"]
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_app_localmongo
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - docker/.env.example
    environment:
      HOTELDATA_PROJECT_ROOT: /app
      APP_PORT: "8000"
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DATABASE: hoteldata_hub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      POCKETBASE_URL: http://host.docker.internal:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      TASK_NUMBER: "03"
      TARGET_RECORDS: "300000"
      GA03_EXPECTED_RECORDS: "300000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ..:/app
    command: python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000

volumes:
  redis_data:
  pocketbase_data:
