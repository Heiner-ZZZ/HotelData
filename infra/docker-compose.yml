services:
  mongo:
    image: mongo:latest
    container_name: hoteldata_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  redis:
    image: redis:latest
    container_name: hoteldata_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: hoteldata_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - docker/.env.example
      - ../.env
    environment:
      HOTELDATA_PROJECT_ROOT: /app
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: hoteldata_hub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      TASK_NUMBER: "03"
      TARGET_RECORDS: "500000"
      GA03_EXPECTED_RECORDS: "500000"
      META_PB: "500000"
      META_MONGO: "500000"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      pocketbase:
        condition: service_started
    volumes:
      - ..:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000

  airflow:
    build:
      context: ..
      dockerfile: infra/docker/airflow3.Dockerfile
    container_name: hoteldata_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: Admin12345*
      _AIRFLOW_WWW_USER_EMAIL: admin@hoteldata.local
      HOTELDATA_PROJECT_ROOT: /opt/hoteldata
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: hoteldata_hub
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      TASK_NUMBER: "03"
      TARGET_RECORDS: "500000"
      GA03_EXPECTED_RECORDS: "500000"
      META_PB: "500000"
      META_MONGO: "500000"
    volumes:
      - ..:/opt/hoteldata
      - ../server/dags:/opt/airflow/dags
      - ./docker/airflow3-entrypoint.sh:/entrypoint3.sh
    depends_on:
      pocketbase:
        condition: service_started
      mongo:
        condition: service_started
    command: bash /entrypoint3.sh

  frontend:
    build:
      context: ../frontend
    container_name: hoteldata_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      app:
        condition: service_started

volumes:
  mongo_data:
  redis_data:
  pocketbase_data:
