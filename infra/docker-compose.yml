name: hoteldata

services:
  mongo:
    image: mongo:7.0
    container_name: hoteldata_mongo
    restart: unless-stopped
    ports:
      - "27018:27018"
    command: mongod --port 27018 --replSet rs0 --bind_ip_all
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27018", "--eval", "try { rs.status().ok } catch(e) { db.adminCommand('ping').ok }"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  mongo-init-rs:
    image: mongo:7.0
    container_name: hoteldata_mongo_init_rs
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --quiet mongodb://mongo:27018 --eval "
        try {
          var status = rs.status();
          print('Replica set already initialized: ' + status.set);
        } catch(e) {
          rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27018'}]});
          print('Replica set initialized successfully.');
        }
      "
    restart: "no"

  redis:
    image: redis:7.4
    container_name: hoteldata_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.26.3
    container_name: hoteldata_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - docker/.env
    environment:
      HOTELDATA_PROJECT_ROOT: /app
      MONGO_URI: mongodb://mongo:27018
      MONGO_DATABASE: hoteldata_hub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      TASK_NUMBER: "03"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    volumes:
      - ../server/src:/app/src
      - ../server/config:/app/config
      - ../server/scripts:/app/scripts
      - ../server/tests:/app/tests
      - ../data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  airflow:
    build:
      context: ..
      dockerfile: infra/docker/airflow3.Dockerfile
    container_name: hoteldata_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:ADMIN
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: Admin12345*
      _AIRFLOW_WWW_USER_EMAIL: admin@hoteldata.local
      HOTELDATA_PROJECT_ROOT: /opt/hoteldata
      MONGO_URI: mongodb://mongo:27018
      MONGO_DATABASE: hoteldata_hub
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      POCKETBASE_PAGE_SIZE: "500"
      TASK_NUMBER: "03"
    env_file: ../.env
    volumes:
      - ../server/src:/opt/hoteldata/src
      - ../server/config:/opt/hoteldata/config
      - ../server/scripts:/opt/hoteldata/scripts
      - ../server/tests:/opt/hoteldata/tests
      - ../server/dags:/opt/airflow/dags
      - ../data:/opt/hoteldata/data
      - ./docker/airflow3-entrypoint.sh:/entrypoint3.sh
    depends_on:
      mongo:
        condition: service_healthy
    command: bash /entrypoint3.sh

  change-stream-watcher:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_change_stream_watcher
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27018
      MONGO_DATABASE: hoteldata_hub
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-rs:
        condition: service_completed_successfully
    volumes:
      - ../server/scripts:/app/scripts
    command: python /app/scripts/change_stream_watcher.py

  frontend:
    build:
      context: ../frontend
    container_name: hoteldata_frontend
    restart: unless-stopped
    ports:
      - "4200:80"

volumes:
  mongo_data:
  redis_data:
  pocketbase_data:
