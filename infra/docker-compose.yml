name: hoteldata

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/docker/airflow3.Dockerfile
  restart: unless-stopped
  env_file:
    - ../.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    HOTELDATA_PROJECT_ROOT: /opt/hoteldata
    MONGO_URI: mongodb://mongo:27018
    MONGO_DATABASE: hoteldata_hub
    POCKETBASE_URL: http://pocketbase:8090
    POCKETBASE_COLLECTION_03: hotel_reservation_events_03
    POCKETBASE_PAGE_SIZE: "500"
    TASK_NUMBER: "03"
    TARGET_RECORDS: "300000"
    GA03_EXPECTED_RECORDS: "300000"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hoteldata}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    HOTELDATA_DATO_DIR: /opt/hoteldata/dato
  volumes: &airflow-common-volumes
    - airflow_home:/opt/airflow
    - ../server/src:/opt/hoteldata/src
    - ../server/config:/opt/hoteldata/config
    - ../server/scripts:/opt/hoteldata/scripts
    - ../server/tests:/opt/hoteldata/tests
    - ../server/dags:/opt/airflow/dags
    - ../data:/opt/hoteldata/data
    # Directorio Dato (afuera del proyecto): .parquet Crudo/Procesado/Terminado.
    - ../../Dato:/opt/hoteldata/dato
  networks:
    - default

services:
  mongo:
    image: mongo:7.0
    container_name: hoteldata_mongo
    restart: unless-stopped
    ports:
      - "27018:27018"
    command: mongod --port 27018 --replSet rs0 --bind_ip_all
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27018", "--eval", "try { rs.status().ok } catch(e) { db.adminCommand('ping').ok }"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  mongo-init-rs:
    image: mongo:7.0
    container_name: hoteldata_mongo_init_rs
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --quiet mongodb://mongo:27018 --eval "
        try {
          var status = rs.status();
          print('Replica set already initialized: ' + status.set);
        } catch(e) {
          rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27018'}]});
          print('Replica set initialized successfully.');
        }
      "
    restart: "no"

  redis:
    image: redis:7.4
    container_name: hoteldata_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1
    container_name: hoteldata_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hoteldata}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.26.3
    container_name: hoteldata_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - docker/.env
    environment:
      HOTELDATA_PROJECT_ROOT: /app
      MONGO_URI: mongodb://mongo:27018
      MONGO_DATABASE: hoteldata_hub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_ENABLED: "true"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_COLLECTION_03: hotel_reservation_events_03
      TASK_NUMBER: "03"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hoteldata}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      HOTELDATA_DATO_DIR: /app/dato
      # Ruta del host Windows que muestra la UI de monitoreo (directorio Dato).
      HOTELDATA_DATO_DIR_HOST: C:\HotelData\Dato
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      TZ: ${TZ:-America/Mexico_City}
      PYTHONPYCACHEPREFIX: /app/.cache/pycache
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    volumes:
      - ../server/src:/app/src
      - ../server/config:/app/config
      - ../server/scripts:/app/scripts
      - ../server/tests:/app/tests
      - ../data:/app/data
      # Directorio Dato (afuera del proyecto): .parquet Crudo/Procesado/Terminado.
      - ../../Dato:/app/dato
      - /var/run/docker.sock:/var/run/docker.sock
    # --reload-dir limitado a código de la app: los cambios en tests/, dags/ o
    # data/ NO reinician la API (y el pipeline M2C corre en subproceso aislado,
    # así que tampoco se ve afectado por el reload del código).
    command: python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src --reload-dir /app/config

  airflow-postgres:
    image: postgres:16
    container_name: hoteldata_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: hoteldata_airflow_init
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: bash -c "airflow db migrate"

  airflow-api-server:
    <<: *airflow-common
    container_name: hoteldata_airflow_api_server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
    command: airflow api-server --port 8080

  airflow-scheduler:
    <<: *airflow-common
    container_name: hoteldata_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: hoteldata_airflow_dag_processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    command: airflow dag-processor

  airflow-triggerer:
    <<: *airflow-common
    container_name: hoteldata_airflow_triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    command: airflow triggerer

  airflow-worker:
    <<: *airflow-common
    container_name: hoteldata_airflow_worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    command: airflow celery worker

  change-stream-watcher:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: hoteldata_change_stream_watcher
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27018
      MONGO_DATABASE: hoteldata_hub
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-rs:
        condition: service_completed_successfully
    volumes:
      - ../server/scripts:/app/scripts
    command: python /app/scripts/change_stream_watcher.py

  frontend:
    build:
      context: ../frontend
    container_name: hoteldata_frontend
    restart: unless-stopped
    environment:
      SYNCFUSION_LICENSE_KEY: ${SYNCFUSION_LICENSE_KEY:-}
    ports:
      - "4200:80"

volumes:
  mongo_data:
  redis_data:
  clickhouse_data:
  pocketbase_data:
  airflow_home:
  airflow_postgres_data:
