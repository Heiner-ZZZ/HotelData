<div class="management-shell">
  <app-access-nav />
  <header class="management-header">
    <div class="management-branding">
      <a class="brand" routerLink="/management">HotelData</a>
      <div>
        <p class="eyebrow">Gestión hotelera</p>
        <strong>Operación, comercial y reportes</strong>
      </div>
    </div>
  </header>

  <section class="management-subnav" aria-label="Navegación de gestión hotelera">
    @for (group of visibleNavigation(); track group.label) {
      <div class="subnav-group">
        <p>{{ group.label }}</p>
        <div class="subnav-items">
          @for (item of group.items; track item.href) {
            <a
              routerLinkActive="is-active"
              [routerLink]="item.href"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            >
              {{ item.label }}
            </a>
          }
        </div>
      </div>
    }
  </section>

  <main class="management-content">
    <router-outlet />
  </main>
</div>
