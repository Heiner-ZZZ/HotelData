<div class="table-wrap">
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Tarifa base</th><th>Moneda</th><th>Activo</th></tr>
    </thead>
    <tbody>
      @for (item of items(); track item.id) {
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td>{{ item.description }}</td>
          <td>${{ item.baseRateLabel }}</td>
          <td>{{ item.currency }}</td>
          <td>{{ item.activeLabel }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
