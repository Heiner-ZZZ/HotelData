<div class="table-wrap">
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Capacidad</th><th>Activo</th></tr>
    </thead>
    <tbody>
      @for (room of items(); track room.id) {
        <tr>
          <td>{{ room.id }}</td>
          <td>{{ room.name }}</td>
          <td>{{ room.description }}</td>
          <td>{{ room.capacityLabel }}</td>
          <td>{{ room.activeLabel }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
