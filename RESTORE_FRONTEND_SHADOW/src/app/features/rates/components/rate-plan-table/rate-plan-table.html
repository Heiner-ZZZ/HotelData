<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Plan</th>
        <th>Descripcion</th>
        <th>Tarifa base</th>
        <th>Moneda</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.ratePlanId) {
        <tr>
          <td>
            <strong>{{ item.name }}</strong>
            <div class="sub">{{ item.ratePlanId }}</div>
          </td>
          <td>{{ item.description }}</td>
          <td>${{ item.baseRateLabel }}</td>
          <td>{{ item.currency }}</td>
          <td>
            <app-status-badge
              [tone]="item.isActive ? 'success' : 'warning'"
              [label]="item.isActive ? 'Activo' : 'Inactivo'"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
