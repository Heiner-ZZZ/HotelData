<section class="surface-card toolbar-card">
  <form class="toolbar-grid" [formGroup]="form()" (ngSubmit)="apply.emit()">
    <label>
      <span>Propiedad</span>
      <select formControlName="propId">
        @for (item of options().propertyOptions; track item.propId) {
          <option [value]="item.propId">{{ item.label }}</option>
        }
      </select>
    </label>

    <label>
      <span>Tipo de habitacion</span>
      <select formControlName="roomTypeId">
        <option value="">Seleccionar</option>
        @for (item of options().roomTypeOptions; track item.roomTypeId) {
          <option [value]="item.roomTypeId">{{ item.name }}</option>
        }
      </select>
    </label>

    <label>
      <span>Plan tarifario</span>
      <select formControlName="ratePlanId">
        <option value="">Seleccionar</option>
        @for (item of options().ratePlanOptions; track item.ratePlanId) {
          <option [value]="item.ratePlanId">{{ item.name }}</option>
        }
      </select>
    </label>

    <label>
      <span>Inicio</span>
      <input type="date" formControlName="startDate" />
    </label>

    <label>
      <span>Fin</span>
      <input type="date" formControlName="endDate" />
    </label>

    <div class="toolbar-actions">
      <button type="submit" [disabled]="loading()">Cargar calendario</button>
    </div>
  </form>
</section>
