[project]
name = "hoteldata-server"
version = "0.1.0"
description = "HotelData FastAPI backend (PMS + CRS + Booking Engine)."
requires-python = ">=3.12,<3.13"
# Dependencies are pinned in `requirements.txt` (Dockerfile uses
# `pip install -r requirements.txt`). This empty list is just to make
# the [project] table PEP 621-compliant so mypy/ruff tooling that reads
# pyproject.toml can resolve metadata. The runtime pip install does
# NOT use this section.
dependencies = []

[tool.ruff]
cache-dir = "../.cache/ruff"

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates these callables as dependency/default descriptors; they are
# intentionally safe in route signatures and are not mutable default values.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "src.app.security.dependencies.require_permission",
    "src.app.security.dependencies.require_any_permission",
    "src.app.security.dependencies.require_prop_permission",
    "src.app.security.dependencies.require_any_prop_permission",
]

[tool.ruff.lint.per-file-ignores]
# Docker source mounts can preserve host executable bits; EXE002 is not
# actionable for Python files in this checkout and must not require chmod.
"**/*.py" = ["EXE002"]

[tool.mypy]
cache_dir = "../.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "../.cache/pytest"
markers = [
    "integration: tests that touch MongoDB/ClickHouse real services (skipped gracefully if unavailable)",
]
